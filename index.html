<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Hero Section -->
    <header class="bg-slate-900 text-white py-20 text-center">
        <div class="max-w-4xl mx-auto px-4">
            <h1 class="text-5xl font-bold mb-4">Bem-vindo ao Nosso Projeto</h1>
            <p class="text-xl text-slate-300">Inovação, design e resultados em um só lugar.</p>
        </div>
    </header>

    <!-- Seção: Capa da Revista -->
    <section class="py-16 max-w-6xl mx-auto px-4 text-center">
        <h2 class="text-3xl font-bold mb-8 text-slate-900">Destaque na Mídia</h2>
        <p class="text-gray-600 mb-8 max-w-2xl mx-auto">Confira nossa mais recente aparição na capa da revista, consolidando nossa autoridade no mercado.</p>
        <div class="flex justify-center">
            <!-- Substitua o src pelo caminho da sua capa de revista -->
            <img src="assets/img/capa-revista.jpg" alt="Capa da Revista" class="w-full max-w-md shadow-2xl rounded-lg border border-gray-200 object-cover">
        </div>
    </section>

    <!-- Seção: 6 Fotos Selecionadas -->
    <section class="bg-white py-16 border-t border-gray-200">
        <div class="max-w-6xl mx-auto px-4">
            <h2 class="text-3xl font-bold mb-10 text-center text-slate-900">Nossa Galeria</h2>
            <!-- Grid para as 6 fotos -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                
                <!-- Foto 1 -->
                <div class="overflow-hidden rounded-lg shadow-md">
                    <img src="assets/img/foto1.jpg" alt="Foto 1" class="w-full h-64 object-cover hover:scale-105 transition-transform duration-300">
                </div>
                <!-- Foto 2 -->
                <div class="overflow-hidden rounded-lg shadow-md">
                    <img src="assets/img/foto2.jpg" alt="Foto 2" class="w-full h-64 object-cover hover:scale-105 transition-transform duration-300">
                </div>
                <!-- Foto 3 -->
                <div class="overflow-hidden rounded-lg shadow-md">
                    <img src="assets/img/foto3.jpg" alt="Foto 3" class="w-full h-64 object-cover hover:scale-105 transition-transform duration-300">
                </div>
                <!-- Foto 4 -->
                <div class="overflow-hidden rounded-lg shadow-md">
                    <img src="assets/img/foto4.jpg" alt="Foto 4" class="w-full h-64 object-cover hover:scale-105 transition-transform duration-300">
                </div>
                <!-- Foto 5 -->
                <div class="overflow-hidden rounded-lg shadow-md">
                    <img src="assets/img/foto5.jpg" alt="Foto 5" class="w-full h-64 object-cover hover:scale-105 transition-transform duration-300">
                </div>
                <!-- Foto 6 -->
                <div class="overflow-hidden rounded-lg shadow-md">
                    <img src="assets/img/foto6.jpg" alt="Foto 6" class="w-full h-64 object-cover hover:scale-105 transition-transform duration-300">
                </div>

            </div>
        </div>
    </section>

    <!-- Seção: Logos das Empresas -->
    <section class="py-16 max-w-6xl mx-auto px-4 text-center">
        <h2 class="text-3xl font-bold mb-10 text-slate-900">Empresas que Confiam em Nós</h2>
        <div class="flex flex-wrap justify-center items-center gap-10 opacity-70">
            <!-- Substitua os src pelos caminhos dos logos -->
            <img src="assets/img/logo-empresa1.png" alt="Logo Empresa 1" class="h-12 hover:opacity-100 transition-opacity">
            <img src="assets/img/logo-empresa2.png" alt="Logo Empresa 2" class="h-12 hover:opacity-100 transition-opacity">
            <img src="assets/img/logo-empresa3.png" alt="Logo Empresa 3" class="h-12 hover:opacity-100 transition-opacity">
            <img src="assets/img/logo-empresa4.png" alt="Logo Empresa 4" class="h-12 hover:opacity-100 transition-opacity">
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white py-8 text-center">
        <div class="max-w-6xl mx-auto px-4">
            <p>&copy; 2026 Nossa Empresa. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
