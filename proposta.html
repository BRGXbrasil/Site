<!DOCTYPE html>
<html lang="pt-BR">

<style>
  :root {
    --brgx-teal: #003F46;
    --brgx-teal-2: #075C63;
    --brgx-gray: #6F7371;
    --brgx-gray-dark: #343A3A;
    --brgx-silver: #B8BCB8;
    --brgx-gold: #A99563;
    --brgx-gold-soft: #D6C8A2;
    --brgx-paper: #F4F0E6;
    --brgx-white: #FFFFFF;
    --brgx-black: #111818;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: Inter, Arial, Helvetica, sans-serif; background: var(--brgx-paper); color: var(--brgx-black); }
  a { text-decoration: none; color: inherit; }

  .site-shell {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at top left, rgba(0,63,70,0.10), transparent 34%),
      linear-gradient(180deg, #F7F3EA 0%, #EFE9DB 100%);
  }

  .nav {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.03em;
    color: var(--brgx-teal);
  }

  .nav-logo span { color: var(--brgx-gray); font-weight: 500; font-size: 12px; display: block; letter-spacing: 0.02em; }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
    font-size: 14px;
    font-weight: 600;
    color: var(--brgx-gray-dark);
  }

  .nav-links a:hover { color: var(--brgx-teal); }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--brgx-teal);
    color: #fff;
    padding: 14px 26px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 14px 34px rgba(0,63,70,0.22);
  }

  .section {
    max-width: 1180px;
    margin: 0 auto;
    padding: 88px 32px;
  }

  .section-title {
    max-width: 760px;
    margin: 0 auto 48px;
    text-align: center;
  }

  .eyebrow {
    color: var(--brgx-gold);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .section-title h2 {
    font-size: clamp(30px, 3.6vw, 46px);
    color: var(--brgx-teal);
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 16px;
    font-weight: 800;
  }

  .brgx-card {
    background: rgba(255,255,255,0.75);
    border: 1px solid rgba(0,63,70,0.12);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 12px 36px rgba(17,24,24,0.05);
  }

  .brgx-card h3 { color: var(--brgx-teal); font-size: 18px; margin-bottom: 8px; font-weight: 700; }
  .brgx-card p { color: var(--brgx-gray-dark); font-size: 14.5px; line-height: 1.6; }

  .split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    align-items: center;
  }
